AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  LINE 13 optional read-mostly API. Three routes, three Lambda functions, three
  DynamoDB tables and one HTTP API. Every function holds its own role with the
  narrowest action and resource set it needs, and the player's core playthrough
  works with this entire stack absent.

Parameters:
  ProjectName:
    Type: String
    Default: line-13
    AllowedPattern: '^[a-z][a-z0-9-]{2,31}$'

  EnvironmentName:
    Type: String
    Default: prod
    AllowedValues: [dev, prod]

  ContentBucketName:
    Type: String
    Description: Content bucket name from the content-storage stack.

  ContentBucketArn:
    Type: String
    Description: Content bucket ARN from the content-storage stack.

  ArtifactBucketName:
    Type: String
    Description: Bucket holding the built Lambda deployment packages.

  DailyEpisodeArtifactKey:
    Type: String
    Description: Object key of the daily-episode package (index.mjs at its root).

  ReplayArtifactKey:
    Type: String

  EndingReportArtifactKey:
    Type: String

  AllowedOrigin:
    Type: String
    Description: >-
      The single site origin permitted by CORS, for example
      https://line13.example. A wildcard is deliberately not accepted.
    AllowedPattern: '^https://[a-z0-9.-]+$'

  LogRetentionDays:
    Type: Number
    Default: 30
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90]

  ThrottleRateLimit:
    Type: Number
    Default: 50
    Description: Steady-state requests per second across the stage.

  ThrottleBurstLimit:
    Type: Number
    Default: 100

  ReplayTtlDays:
    Type: Number
    Default: 90
    MinValue: 1
    MaxValue: 365

Resources:
  # ---------------------------------------------------------------- data stores

  EpisodeTable:
    Type: AWS::DynamoDB::Table
    UpdateReplacePolicy: Retain
    DeletionPolicy: Retain
    Properties:
      TableName: !Sub '${ProjectName}-${EnvironmentName}-episodes'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: episodeId
          AttributeType: S
        - AttributeName: publishedDay
          AttributeType: S
      KeySchema:
        - AttributeName: episodeId
          KeyType: HASH
      GlobalSecondaryIndexes:
        # The daily lookup is a one-item query on this index, never a scan.
        - IndexName: published-day-index
          KeySchema:
            - AttributeName: publishedDay
              KeyType: HASH
            - AttributeName: episodeId
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      DeletionProtectionEnabled: true

  ReplayTable:
    Type: AWS::DynamoDB::Table
    UpdateReplacePolicy: Retain
    DeletionPolicy: Retain
    Properties:
      TableName: !Sub '${ProjectName}-${EnvironmentName}-replays'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: replayCode
          AttributeType: S
      KeySchema:
        - AttributeName: replayCode
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true

  EndingCounterTable:
    Type: AWS::DynamoDB::Table
    UpdateReplacePolicy: Retain
    DeletionPolicy: Retain
    Properties:
      TableName: !Sub '${ProjectName}-${EnvironmentName}-ending-counters'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: episodeId
          AttributeType: S
        - AttributeName: endingId
          AttributeType: S
      KeySchema:
        - AttributeName: episodeId
          KeyType: HASH
        - AttributeName: endingId
          KeyType: RANGE
      SSESpecification:
        SSEEnabled: true

  # ------------------------------------------------------------------ log group

  DailyEpisodeLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${ProjectName}-${EnvironmentName}-daily-episode'
      RetentionInDays: !Ref LogRetentionDays

  ReplayLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${ProjectName}-${EnvironmentName}-replay'
      RetentionInDays: !Ref LogRetentionDays

  EndingReportLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${ProjectName}-${EnvironmentName}-ending-report'
      RetentionInDays: !Ref LogRetentionDays

  ApiAccessLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/apigateway/${ProjectName}-${EnvironmentName}-api'
      RetentionInDays: !Ref LogRetentionDays

  # ----------------------------------------------------------------------- roles
  #
  # Each function gets its own role. Log groups are created above, so no role
  # holds logs:CreateLogGroup, and each role can write only to its own stream.

  DailyEpisodeRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-${EnvironmentName}-daily-episode'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: 'sts:AssumeRole'
      Policies:
        - PolicyName: read-published-episode
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: QueryPublishedDay
                Effect: Allow
                Action: 'dynamodb:Query'
                Resource: !Sub '${EpisodeTable.Arn}/index/published-day-index'

              - Sid: ReadManifestObjects
                Effect: Allow
                Action: 's3:GetObject'
                # Scoped to the manifest prefix: this role cannot read the audio
                # prefix, and cannot list the bucket.
                Resource: !Sub '${ContentBucketArn}/episodes/*'

              - Sid: WriteOwnLogStream
                Effect: Allow
                Action:
                  - 'logs:CreateLogStream'
                  - 'logs:PutLogEvents'
                Resource: !Sub '${DailyEpisodeLogGroup.Arn}:*'

  ReplayRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-${EnvironmentName}-replay'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: 'sts:AssumeRole'
      Policies:
        - PolicyName: read-one-replay
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # GetItem only: no Query, no Scan, so the whole replay table can
              # never be enumerated through this function.
              - Sid: GetReplayByCode
                Effect: Allow
                Action: 'dynamodb:GetItem'
                Resource: !GetAtt ReplayTable.Arn

              - Sid: WriteOwnLogStream
                Effect: Allow
                Action:
                  - 'logs:CreateLogStream'
                  - 'logs:PutLogEvents'
                Resource: !Sub '${ReplayLogGroup.Arn}:*'

  EndingReportRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-${EnvironmentName}-ending-report'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: 'sts:AssumeRole'
      Policies:
        - PolicyName: increment-ending-counter
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # UpdateItem alone. The new total comes back from the atomic ADD,
              # so this role needs no read permission, and it can neither list
              # the aggregates nor delete one.
              - Sid: IncrementCounter
                Effect: Allow
                Action: 'dynamodb:UpdateItem'
                Resource: !GetAtt EndingCounterTable.Arn

              - Sid: WriteOwnLogStream
                Effect: Allow
                Action:
                  - 'logs:CreateLogStream'
                  - 'logs:PutLogEvents'
                Resource: !Sub '${EndingReportLogGroup.Arn}:*'

  # ------------------------------------------------------------------- functions

  DailyEpisodeFunction:
    Type: AWS::Lambda::Function
    DependsOn: DailyEpisodeLogGroup
    Properties:
      FunctionName: !Sub '${ProjectName}-${EnvironmentName}-daily-episode'
      Description: Serves the published episode manifest for a UTC day.
      Runtime: nodejs22.x
      Architectures: [arm64]
      Handler: index.handler
      MemorySize: 256
      Timeout: 5
      ReservedConcurrentExecutions: 20
      Role: !GetAtt DailyEpisodeRole.Arn
      Code:
        S3Bucket: !Ref ArtifactBucketName
        S3Key: !Ref DailyEpisodeArtifactKey
      Environment:
        Variables:
          EPISODE_TABLE_NAME: !Ref EpisodeTable
          EPISODE_DAY_INDEX_NAME: published-day-index
          CONTENT_BUCKET_NAME: !Ref ContentBucketName
          MANIFEST_PREFIX: 'episodes/'
          NODE_OPTIONS: '--enable-source-maps'

  ReplayFunction:
    Type: AWS::Lambda::Function
    DependsOn: ReplayLogGroup
    Properties:
      FunctionName: !Sub '${ProjectName}-${EnvironmentName}-replay'
      Description: Resolves a short replay code to its event sequence.
      Runtime: nodejs22.x
      Architectures: [arm64]
      Handler: index.handler
      MemorySize: 256
      Timeout: 5
      ReservedConcurrentExecutions: 20
      Role: !GetAtt ReplayRole.Arn
      Code:
        S3Bucket: !Ref ArtifactBucketName
        S3Key: !Ref ReplayArtifactKey
      Environment:
        Variables:
          REPLAY_TABLE_NAME: !Ref ReplayTable
          NODE_OPTIONS: '--enable-source-maps'

  EndingReportFunction:
    Type: AWS::Lambda::Function
    DependsOn: EndingReportLogGroup
    Properties:
      FunctionName: !Sub '${ProjectName}-${EnvironmentName}-ending-report'
      Description: Records one anonymous ending and returns the aggregate.
      Runtime: nodejs22.x
      Architectures: [arm64]
      Handler: index.handler
      MemorySize: 256
      Timeout: 5
      ReservedConcurrentExecutions: 10
      Role: !GetAtt EndingReportRole.Arn
      Code:
        S3Bucket: !Ref ArtifactBucketName
        S3Key: !Ref EndingReportArtifactKey
      Environment:
        Variables:
          ENDING_COUNTER_TABLE_NAME: !Ref EndingCounterTable
          REPLAY_TTL_DAYS: !Ref ReplayTtlDays
          NODE_OPTIONS: '--enable-source-maps'

  # ------------------------------------------------------------------- http api

  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub '${ProjectName}-${EnvironmentName}-api'
      Description: LINE 13 optional episode and replay API.
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins:
          - !Ref AllowedOrigin
        AllowMethods: [GET, POST]
        AllowHeaders: [content-type]
        MaxAge: 600
        # Credentials are never sent: there is no session to carry.
        AllowCredentials: false

  HttpApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref HttpApi
      StageName: $default
      AutoDeploy: true
      DefaultRouteSettings:
        ThrottlingRateLimit: !Ref ThrottleRateLimit
        ThrottlingBurstLimit: !Ref ThrottleBurstLimit
        DetailedMetricsEnabled: true
      AccessLogSettings:
        DestinationArn: !GetAtt ApiAccessLogGroup.Arn
        # Operational fields only. Source IP, user agent, request headers and
        # the integration error message are all deliberately absent, so the
        # access log holds nothing that identifies a player and nothing that
        # could carry an internal detail out of a handler (R8.4, R10.4).
        Format: >-
          {"requestId":"$context.requestId","routeKey":"$context.routeKey","status":"$context.status","latencyMs":"$context.responseLatency","responseLength":"$context.responseLength","integrationStatus":"$context.integrationStatus"}

  DailyEpisodeIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt DailyEpisodeFunction.Arn
      PayloadFormatVersion: '2.0'
      TimeoutInMillis: 5000

  ReplayIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt ReplayFunction.Arn
      PayloadFormatVersion: '2.0'
      TimeoutInMillis: 5000

  EndingReportIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt EndingReportFunction.Arn
      PayloadFormatVersion: '2.0'
      TimeoutInMillis: 5000

  DailyEpisodeRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'GET /v1/episodes/daily'
      AuthorizationType: NONE
      Target: !Sub 'integrations/${DailyEpisodeIntegration}'

  ReplayRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'GET /v1/replays/{replayCode}'
      AuthorizationType: NONE
      Target: !Sub 'integrations/${ReplayIntegration}'

  EndingReportRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'POST /v1/endings'
      AuthorizationType: NONE
      Target: !Sub 'integrations/${EndingReportIntegration}'

  # Each permission names one route, so a function cannot be reached through a
  # route it does not serve.
  DailyEpisodeInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt DailyEpisodeFunction.Arn
      Action: 'lambda:InvokeFunction'
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*/GET/v1/episodes/daily'

  ReplayInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt ReplayFunction.Arn
      Action: 'lambda:InvokeFunction'
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*/GET/v1/replays/*'

  EndingReportInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt EndingReportFunction.Arn
      Action: 'lambda:InvokeFunction'
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*/POST/v1/endings'

Outputs:
  ApiEndpoint:
    Value: !GetAtt HttpApi.ApiEndpoint
    Description: Base URL. The game must remain completable when this is down.

  EpisodeTableArn:
    Value: !GetAtt EpisodeTable.Arn

  ReplayTableArn:
    Value: !GetAtt ReplayTable.Arn

  EndingCounterTableArn:
    Value: !GetAtt EndingCounterTable.Arn
