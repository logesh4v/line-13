name: ci

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.18'
          cache: npm

      # Kiroween rule + spec Milestone 1: .kiro must be committed, not ignored, and the
      # fixtures/assets the build needs must exist. Runs before install so a bad
      # checkout fails in seconds.
      - name: .kiro tracked, not ignored; required assets present
        run: node scripts/check-kiro.mjs

      - name: Install
        run: npm ci

      - name: Lint (hooks, steering, episodes)
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Property tests (10,000 generated episodes)
        run: PBT_SEED=1113 npm run pbt

      - name: Upload property-test run record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pbt-last-run
          path: .pbt/last-run.json
          if-no-files-found: ignore

      - name: Build
        run: npm run build

  # Cross-browser E2E: all nine projects (three engines x 1440/820/390), axe-core on
  # every screen. Chromium and Firefox run all three widths in one job each. WebKit
  # on Linux spends ~0.4 s per pointer action (measured with audio and animation
  # stubbed out, so it is the engine, not the game), so it gets one job per width.
  # The official Playwright image ships the browsers and their system libraries, so
  # this job never calls apt (`playwright install --with-deps` failed here when the
  # runner's Ubuntu mirrors stopped resolving). Keep the tag equal to the
  # @playwright/test version in package-lock.json.
  e2e:
    name: e2e (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: chromium, projects: 'chromium-' }
          - { name: firefox, projects: 'firefox-' }
          - { name: webkit-1440, projects: 'webkit-1440' }
          - { name: webkit-820, projects: 'webkit-820' }
          - { name: webkit-390, projects: 'webkit-390' }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.18'
          cache: npm

      - name: Install
        run: npm ci

      - name: E2E (${{ matrix.name }}, axe-core on every screen)
        run: npm run e2e -w @line-13/web
        env:
          E2E_PROJECT_FILTER: ${{ matrix.projects }}
          # Firefox refuses to start as root when HOME belongs to another user, and
          # Actions sets HOME=/github/home inside containers; a step env wins.
          HOME: /root

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-${{ matrix.name }}
          path: apps/web/test-results
          if-no-files-found: ignore
