name: ci

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.18'
          cache: npm

      # Kiroween rule + spec Milestone 1: .kiro must be committed, not ignored, and the
      # fixtures/assets the build needs must exist. Runs before install so a bad
      # checkout fails in seconds.
      - name: .kiro tracked, not ignored; required assets present
        run: node scripts/check-kiro.mjs

      - name: Install
        run: npm ci

      - name: Lint (hooks, steering, episodes)
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Property tests (10,000 generated episodes)
        run: PBT_SEED=1113 npm run pbt

      - name: Upload property-test run record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pbt-last-run
          path: .pbt/last-run.json
          if-no-files-found: ignore

      - name: Build
        run: npm run build

      # Cross-browser E2E: chromium, webkit and firefox at 1440, 820 and 390.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit firefox
        working-directory: apps/web

      - name: E2E (nine projects, axe-core on every screen)
        run: npm run e2e -w @line-13/web

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: apps/web/test-results
          if-no-files-found: ignore
