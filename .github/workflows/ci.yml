name: ci

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.18'
          cache: npm

      # Kiroween rule + spec Milestone 1: .kiro must be committed, not ignored, and the
      # fixtures/assets the build needs must exist. Runs before install so a bad
      # checkout fails in seconds.
      - name: .kiro tracked, not ignored; required assets present
        run: node scripts/check-kiro.mjs

      - name: Install
        run: npm ci

      - name: Lint (hooks, steering, episodes)
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Property tests (10,000 generated episodes)
        run: PBT_SEED=1113 npm run pbt

      - name: Upload property-test run record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pbt-last-run
          path: .pbt/last-run.json
          if-no-files-found: ignore

      - name: Build
        run: npm run build

  # Cross-browser E2E: one job per engine, each running that engine at 1440, 820 and
  # 390 (nine projects in total). Axe-core runs on every screen in every project.
  # Pinned: ubuntu-latest moved to a release whose apt mirrors failed to resolve, so
  # `playwright install --with-deps` retried until the old 20-minute cap.
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit, firefox]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.18'
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps ${{ matrix.browser }}
        working-directory: apps/web

      - name: E2E (${{ matrix.browser }} x 1440/820/390, axe-core on every screen)
        run: npm run e2e -w @line-13/web
        env:
          E2E_PROJECT_FILTER: ${{ matrix.browser }}-

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-${{ matrix.browser }}
          path: apps/web/test-results
          if-no-files-found: ignore
